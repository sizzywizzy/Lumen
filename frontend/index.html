<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ?v= makes browsers drop the cached copy of the old camera icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Text uses each device's own system font, so only the icon font is loaded.
         display=block: icons are ligatures, so a swap would flash their names as text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <title>Lumen</title>
    <script>
      // Paint the theme before first render so there is no flash. Lumen is light
      // unless the viewer has switched to dark (see theme/ThemeProvider.jsx).
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("lumen-theme-choice") === "dark") theme = "dark";
        } catch (e) {
          /* storage blocked: stay light */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
