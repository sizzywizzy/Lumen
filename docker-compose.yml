# Optional local stack: `docker compose up`. Replit/dev can just run
# uvicorn + vite directly (see README Getting Started).
services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "for attempt in 1 2 3 4 5; do pip install -r requirements.txt && break; echo 'Dependency install failed; retrying in 5s...' >&2; sleep 5; done && python -c 'import fastapi, uvicorn' && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    env_file:
      - path: .env
        required: false

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - DOCKER_ENV=true
    depends_on:
      backend:
        condition: service_healthy
